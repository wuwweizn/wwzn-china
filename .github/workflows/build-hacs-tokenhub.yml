name: Build and Push hacs_tokenhub (Multi-Arch, Docker Hub + GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tokenhub/**'
      - '.github/workflows/build-hacs-tokenhub.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_arch: amd64
          - arch: arm64
            platform: linux/arm64
            build_arch: aarch64
          - arch: armv7
            platform: linux/arm/v7
            build_arch: armv7

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Get lowercase repo owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract VERSION and BUILD_FROM from config
        run: |
          ADDON_DIR="tokenhub"
          CONFIG_PATH="${ADDON_DIR}/config.yaml"
          BUILD_YAML="${ADDON_DIR}/build.yaml"
          BUILD_ARCH="${{ matrix.build_arch }}"

          if [[ ! -f "$CONFIG_PATH" ]]; then
            echo "❌ ERROR: $CONFIG_PATH not found!"
            exit 1
          fi

          VERSION=$(yq e ".version" "$CONFIG_PATH")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "💡 VERSION=$VERSION"

          if [[ -f "$BUILD_YAML" ]]; then
            BUILD_FROM=$(yq e ".build_from.${BUILD_ARCH}" "$BUILD_YAML")
          else
            BUILD_FROM="python:3.11-slim"
          fi
          echo "BUILD_FROM=$BUILD_FROM" >> $GITHUB_ENV
          echo "BUILD_ARCH=$BUILD_ARCH" >> $GITHUB_ENV
          echo "💡 BUILD_FROM=$BUILD_FROM"
          echo "💡 BUILD_ARCH=$BUILD_ARCH"

      - name: Encrypt init token
        run: |
          python3 -c "
import base64, hashlib
token = '${{ secrets.TOKENHUB_INIT_TOKEN }}'
if not token:
    print('')
else:
    key = hashlib.sha256(b'hacs-tokenhub-wwzn-2024').digest()
    enc = bytes([ord(c) ^ key[i % len(key)] for i, c in enumerate(token)])
    print(base64.b64encode(enc).decode())
" > tokenhub/app/init_token.enc

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push hacs_tokenhub for ${{ matrix.arch }}
        uses: docker/build-push-action@v5
        with:
          context: tokenhub
          file: tokenhub/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LC }}/hacs_tokenhub-${{ env.BUILD_ARCH }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_OWNER_LC }}/hacs_tokenhub-${{ env.BUILD_ARCH }}:latest
            ${{ secrets.DOCKER_USERNAME }}/hacs_tokenhub-${{ env.BUILD_ARCH }}:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/hacs_tokenhub-${{ env.BUILD_ARCH }}:latest
          build-args: |
            BUILD_FROM=${{ env.BUILD_FROM }}
            BUILD_ARCH=${{ env.BUILD_ARCH }}
